<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Legal AI Assistant — Gemini</title>
<style>
:root{
  --bg:#f6f5f2; --panel:#ffffff; --ink:#1c1b19; --sub:#66625b; --line:#e4e0d8;
  --accent:#7a4a2b; --accent-ink:#fff; --green:#2f7a4d; --yellow:#a3720b; --red:#a33b2f;
  --mono:'SFMono-Regular',Consolas,monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#161513;--panel:#1f1d1a;--ink:#efece6;--sub:#a39d90;--line:#332f29;--accent:#c98a55;--accent-ink:#161513;}
}
:root[data-theme="dark"]{--bg:#161513;--panel:#1f1d1a;--ink:#efece6;--sub:#a39d90;--line:#332f29;--accent:#c98a55;--accent-ink:#161513;}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;}
header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:var(--panel)}
header h1{font-size:17px;margin:0;letter-spacing:.02em}
header .tag{font-size:11px;color:var(--sub);font-family:var(--mono)}
.layout{display:grid;grid-template-columns:220px 1fr 300px;gap:1px;background:var(--line);min-height:calc(100vh - 54px)}
@media (max-width:880px){.layout{grid-template-columns:1fr}}
.col{background:var(--bg);padding:16px;overflow-x:auto}
.col h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--sub);margin:0 0 10px}
.case-item{padding:8px 10px;border-radius:6px;cursor:pointer;font-size:13px;margin-bottom:4px;border:1px solid transparent}
.case-item:hover{border-color:var(--line)}
.case-item.active{background:var(--accent);color:var(--accent-ink)}
button{font-family:inherit;font-size:13px;padding:8px 14px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
button.ghost{background:transparent;color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
input,textarea,select{width:100%;font-family:inherit;font-size:13px;padding:7px 9px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);margin-bottom:9px}
textarea{min-height:80px;resize:vertical}
label{font-size:11px;color:var(--sub);display:block;margin-bottom:3px}
.field{margin-bottom:10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}
.badge{display:inline-block;font-size:10px;font-family:var(--mono);padding:2px 7px;border-radius:10px;margin-right:6px}
.b-green{background:rgba(47,122,77,.15);color:var(--green)}
.b-yellow{background:rgba(163,114,11,.15);color:var(--yellow)}
.b-red{background:rgba(163,59,47,.15);color:var(--red)}
.item{font-size:13px;margin-bottom:8px;line-height:1.5;border-left:2px solid var(--line);padding-left:8px}
.doc-preview{white-space:pre-wrap;font-size:12.5px;line-height:1.6;max-height:60vh;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:10px;background:var(--bg)}
.doc-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.doc-actions button{margin:0}
.doc-help{font-size:11px;color:var(--sub);margin-top:6px;line-height:1.45}
.doc-preview{font-family:Georgia,'Times New Roman',serif;min-height:260px}
.muted{color:var(--sub);font-size:12px}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{padding:5px 10px;font-size:12px}
.disclaimer{font-size:11px;color:var(--sub);border-top:1px dashed var(--line);margin-top:10px;padding-top:8px}
.firm-brand{display:flex;align-items:center;gap:8px}
.firm-brand img{height:32px;max-width:80px;object-fit:contain}
.iconbtn{border:1px solid var(--line);background:var(--panel);color:var(--sub);border-radius:6px;padding:6px 10px;cursor:pointer}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;max-width:420px;width:100%}
.modal h2{margin-top:0}
.tl{position:relative;padding-left:18px;margin-top:8px}
.tl-item{position:relative;padding:0 0 16px 14px;border-left:2px solid var(--line);font-size:13px}
.tl-item:last-child{border-color:transparent}
.tl-item::before{content:"";position:absolute;left:-6px;top:2px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.tl-date{font-family:var(--mono);font-size:11px;color:var(--sub);display:block}
.tl-add{display:flex;gap:6px;margin-top:8px}
.tl-add input{margin-bottom:0}
.check-cat{font-size:12px;font-weight:bold;margin:10px 0 4px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em}
.check-item{font-size:13px;margin-bottom:4px}
.gemini-status{font-family:var(--mono);font-size:11px;color:var(--sub)}
.upload-box{border:1px dashed var(--line);padding:10px;border-radius:8px;background:var(--panel);margin-bottom:10px}.upload-box small{display:block;color:var(--sub);line-height:1.4;margin-top:4px}.client-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:700px){.client-grid{grid-template-columns:1fr}}
</style>
</head>
<script>
// DOCX dibuat langsung di browser tanpa CDN/library eksternal.
// Ini penting karena aplikasi sering dibuka dari content:// di Android,
// sehingga library dari CDN dapat gagal dimuat.
window.docxReady = Promise.resolve(true);
</script>
<body>
<header>
  <div style="display:flex;align-items:center;gap:14px">
    <div>
      <h1>⚖ Legal AI Assistant</h1>
      <div class="tag">Dibuat oleh Muzammil, S.H., M.H.</div>
    </div>
    <div class="firm-brand" id="firmBrand"></div>
  </div>
  <div style="display:flex;align-items:center;gap:10px">

<div id="modalRoot"></div>
<div id="geminiModalRoot"></div>
<div class="layout">
  <div class="col">
    <h2>Perkara</h2>

    <div id="caseList"></div>
    <div style="margin-top:14px;padding-top:10px;border-top:1px solid var(--line)">
      <div class="muted" style="margin-bottom:6px">Data tersimpan di browser ini saja. Cadangkan secara berkala:</div>
      <button class="ghost" id="btnExport" style="width:100%;margin-bottom:6px" ${'' /*downloads*/}>Ekspor Cadangan (.json)</button>
      <label class="ghost" style="display:block;text-align:center;border:1px solid var(--accent);border-radius:6px;padding:7px;cursor:pointer;font-size:13px;color:var(--accent)">
        Impor Cadangan<input type="file" id="btnImport" accept=".json" style="display:none">
      </label>
    </div>
  </div>
  <div class="col" id="middleCol"></div>
  <div class="col" id="docCol"></div>
</div>

<script>
const LS_KEY = "legal_ai_cases_v1";
const FIRM_KEY = "legal_ai_firm_v1";
let state = { cases: JSON.parse(localStorage.getItem(LS_KEY) || "[]"), activeId: null };

// Bersihkan markdown dari dokumen agar hasil Word tidak menampilkan tanda *.
function cleanDocumentText(text){
  if(text == null) return "";
  let s = String(text).replace(/\r\n?/g, "\n");
  s = s.replace(/```(?:[a-zA-Z]+)?/g, "");
  s = s.replace(/\*\*/g, "");
  s = s.replace(/\*/g, "");
  s = s.replace(/^#{1,6}\s*/gm, "");
  s = s.replace(/^\s*[-•]\s+/gm, "• ");
  s = s.replace(/\n{3,}/g, "\n\n");
  return s.trim();
}

function cleanStoredDocuments(){
  state.cases.forEach(c => {
    ["suratKuasaKhusus","suratKuasaUmum","pleidoi","somasi","suratGugatan","jawabanTergugat","replik","duplikTergugat","kesimpulanPerdata","eksepsi","jawabanTermohon","duplikTermohon","suratBanding"].forEach(k => {
      if(c[k]) c[k] = cleanDocumentText(c[k]);
    });
  });
}
cleanStoredDocuments();
let firm = JSON.parse(localStorage.getItem(FIRM_KEY) || "{}");
// Dukungan beberapa kop surat. Data lama yang hanya memiliki `letterhead`
// otomatis dimigrasikan menjadi satu item agar tetap dapat dipakai.
function ensureLetterheads(){
  if(!Array.isArray(firm.letterheads)) firm.letterheads = [];
  if(firm.letterhead && !firm.letterheads.some(x => x && x.image === firm.letterhead)){
    firm.letterheads.unshift({
      id: "lh_" + Date.now(),
      name: "Kop Surat Lama",
      image: firm.letterhead,
      createdAt: Date.now()
    });
  }
  if(firm.letterheads.length && !firm.letterhead) firm.letterhead = firm.letterheads[0].image;
}
ensureLetterheads();
let firmModalOpen = false;

function getLetterheads(){
  ensureLetterheads();
  return firm.letterheads.filter(x => x && x.image);
}

function getLetterheadById(id){
  return getLetterheads().find(x => x.id === id) || null;
}

function getSelectedLetterhead(c, key){
  const id = c?.kopPilihan?.[key] || c?.kopDefault || "";
  const selected = getLetterheadById(id);
  if(selected) return selected;
  const first = getLetterheads()[0] || null;
  if(first && c){
    c.kopPilihan = c.kopPilihan || {};
    c.kopPilihan[key] = first.id;
    c.kopDefault = c.kopDefault || first.id;
  }
  return first;
}

function letterheadOptions(selectedId=""){
  const items = getLetterheads();
  if(!items.length) return `<option value="">Tidak ada kop tersimpan — gunakan kop otomatis</option>`;
  return `<option value="">Tanpa kop gambar / gunakan kop otomatis</option>` + items.map(x =>
    `<option value="${escapeHtml(x.id)}" ${x.id===selectedId?'selected':''}>${escapeHtml(x.name || "Kop Surat")}</option>`
  ).join("");
}


const GEMINI_KEY = "gemini_api_key";

function getGeminiKey(){
  return localStorage.getItem(GEMINI_KEY) || "";
}

function renderGeminiModal(){
  const root = document.getElementById("geminiModalRoot");
  root.innerHTML = `
    <div class="modal-overlay" id="geminiOverlay">
      <div class="modal">
        <h2>Gemini API</h2>
        <div class="muted" style="margin-bottom:10px">
          Gunakan API Key Gemini yang sudah dipakai aplikasi AI ini. Key disimpan lokal di browser.
        </div>
        <div class="field">
          <label>Gemini API Key</label>
          <input type="password" id="geminiKeyInput" placeholder="AIzaSy..." value="${getGeminiKey().replace(/"/g,'&quot;')}">
        </div>
        <div class="muted" style="margin-bottom:12px">
          API Key tidak dikirim ke server aplikasi ini; pemanggilan dilakukan langsung dari browser ke Gemini API.
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button id="geminiSave">Simpan</button>
          <button class="ghost" id="geminiClear">Hapus Key</button>
          <button class="ghost" id="geminiClose">Tutup</button>
        </div>
      </div>
    </div>`;
  const close = () => root.innerHTML = "";
  document.getElementById("geminiOverlay").onclick = e => {
    if(e.target.id === "geminiOverlay") close();
  };
  document.getElementById("geminiClose").onclick = close;
  document.getElementById("geminiSave").onclick = () => {
    const key = document.getElementById("geminiKeyInput").value.trim();
    if(!key){ alert("Masukkan Gemini API Key."); return; }
    localStorage.setItem(GEMINI_KEY, key);
    updateCapStatus();
    close();
  };
  document.getElementById("geminiClear").onclick = () => {
    localStorage.removeItem(GEMINI_KEY);
    updateCapStatus();
    close();
  };
}

function safeJson(text){
  if(typeof text !== "string") return text;
  let s = text.trim();
  s = s.replace(/^```(?:json)?\s*/i, "").replace(/\s*```$/i, "").trim();
  const first = s.indexOf("{"), last = s.lastIndexOf("}");
  if(first >= 0 && last > first) s = s.slice(first, last + 1);
  return JSON.parse(s);
}

async function panggilGemini(promptTeks, options = {}){
  const apiKey = getGeminiKey();
  if(!apiKey) throw new Error("Gemini API Key belum diatur. Klik tombol ⚙ Gemini API.");

  const daftarModel = [
    options.model || "gemini-3.8-flash",
    "gemini-3.7-flash",
    "gemini-3.6-flash",
    "gemini-3.5-flash",
    "gemini-3.5-flash-lite",
    "gemini-2.5-flash"
  ].filter((v,i,a)=>v && a.indexOf(v)===i);

  let errorTerakhir = null;
  for(const model of daftarModel){
    try{
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`;
      const response = await fetch(url,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          contents:[{parts:[
            {text:promptTeks},
            ...((options.attachments||[]).map(a=>({inline_data:{mime_type:a.mimeType, data:a.base64}})))
          ]}],
          generationConfig: options.json ? {
            responseMimeType:"application/json",
            temperature:0.2,
            maxOutputTokens: options.maxOutputTokens || 16000
          } : {
            temperature:0.35,
            maxOutputTokens: options.maxOutputTokens || 16000
          }
        })
      });
      const data = await response.json();
      const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
      if(response.ok && text) return text;
      errorTerakhir = data?.error?.message || `HTTP ${response.status}`;
    }catch(e){
      errorTerakhir = e.message || String(e);
    }
  }
  throw new Error("Semua model Gemini gagal dipanggil. Model dicoba: " + daftarModel.join(", ") + ". Detail terakhir: " + (errorTerakhir || "error tidak diketahui"));
}

function fileToDataUrl(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(new Error("File tidak dapat dibaca."));
    reader.onload=()=>resolve(String(reader.result||""));
    reader.readAsDataURL(file);
  });
}
function dataUrlParts(dataUrl){
  const m=String(dataUrl||"").match(/^data:([^;,]+);base64,(.*)$/s);
  if(!m) throw new Error("Data file tidak valid.");
  return {mimeType:m[1],base64:m[2]};
}
async function extractClientFromKtp(file){
  if(!(await ensureGemini())) return;
  const status=document.getElementById("clientUploadStatus");
  if(status) status.textContent="Membaca KTP dengan Gemini…";
  try{
    const du=await fileToDataUrl(file), a=dataUrlParts(du);
    const prompt=`Anda membantu mengisi DATA KLIEN dari dokumen KTP/identitas yang diunggah. Ekstrak HANYA data yang benar-benar terbaca. Jangan menebak atau melengkapi sendiri. Jika suatu data tidak terbaca, kosongkan. Balas HANYA JSON valid:\n{"name":"","address":"","ktp":"","phone":"","profession":"","nationality":"","birth":"","status_klien":""}\nUntuk birth gabungkan tempat/tanggal lahir jika tersedia. Untuk phone/profession/nationality, jangan mengarang bila tidak tercantum.`;
    const raw=await panggilGemini(prompt,{json:true,attachments:[a]});
    const d=safeJson(raw); const c=activeCase(); if(!c) return;
    c.name=d.name||c.name||"Perkara Baru";
    c.clientAddress=d.address||c.clientAddress||"";
    c.clientKtp=d.ktp||c.clientKtp||"";
    c.clientPhone=d.phone||c.clientPhone||"";
    c.clientProfession=d.profession||c.clientProfession||"";
    c.clientNationality=d.nationality||c.clientNationality||"Warga Negara Indonesia";
    c.clientBirth=d.birth||c.clientBirth||"";
    if(d.status_klien && !c.clientStatus) c.clientStatus=d.status_klien;
    save(); renderMiddle(); renderCaseList();
    if(status) status.textContent="✓ Data KTP berhasil diekstrak. Silakan periksa dan koreksi bila perlu.";
  }catch(e){ if(status) status.textContent="Gagal membaca KTP: "+(e.message||e); }
}
async function analyzeCasePdf(file){
  if(!(await ensureGemini())) return;
  const status=document.getElementById("pdfUploadStatus");
  if(status) status.textContent="Menganalisis PDF perkara dengan Gemini…";
  try{
    const du=await fileToDataUrl(file), a=dataUrlParts(du), c=activeCase(); if(!c) return;
    const prompt=`Anda adalah asisten analisis perkara hukum Indonesia. Analisis dokumen PDF perkara/kronologi yang diunggah dan ekstrak HANYA data yang benar-benar terdapat dalam dokumen. Jangan mengarang, jangan menebak, dan jangan mengisi data yang tidak disebutkan. Jika informasi tidak tersedia atau tidak terbaca, kosongkan. Buat JSON valid dengan struktur:\n{"jenis_perkara":"","posisi":"","status_klien":"","pengadilan":"","lokasi":"","nama_klien":"","data_klien":{"alamat":"","ktp":"","no_hp":"","profesi":"","kewarganegaraan":"","tempat_tanggal_lahir":""},"kronologi":"","bukti":"","tujuan":"","tanggal_peristiwa":"","pihak_lain":[],"catatan_verifikasi":[]}\nPENTING: Jika PDF merupakan kronologi atau uraian perkara dan di dalamnya terdapat identitas/data klien, ambil data tersebut juga. Data klien dapat berasal dari narasi kronologi, surat, BAP, laporan, putusan, atau dokumen perkara lain; tidak wajib berasal dari KTP. Jika nama, alamat, NIK/KTP, nomor HP, profesi, kewarganegaraan, atau tempat/tanggal lahir disebutkan secara jelas, masukkan ke data_klien. Jika dokumen secara jelas menyebut status klien sebagai tersangka, terdakwa, atau terpidana, masukkan status tersebut ke status_klien. Jangan menebak status hanya dari konteks; jika tidak disebutkan jelas, kosongkan. Jangan mengubah format data yang tertulis dan jangan menebak data yang tidak ada.\nKronologi harus berupa urutan fakta yang tertulis dalam PDF, bukan asumsi. Bukti hanya sebutkan bukti/dokumen yang disebut. Tujuan boleh diisi hanya jika jelas dari dokumen. Jika ada dasar hukum dalam PDF, jangan otomatis menganggapnya masih berlaku; masukkan isu itu ke catatan_verifikasi.`;
    const raw=await panggilGemini(prompt,{json:true,attachments:[a]});
    const d=safeJson(raw);
    if(d.jenis_perkara) c.type=d.jenis_perkara;
    if(d.posisi) c.position=d.posisi;
    if(d.status_klien && (!c.clientStatus || c.clientStatus === "Belum ditentukan")) c.clientStatus=d.status_klien;
    if(d.pengadilan) c.court=d.pengadilan;
    if(d.lokasi) c.location=d.lokasi;
    // Data klien dari PDF hanya mengisi kolom yang masih kosong agar tidak menimpa data yang sudah diinput/diverifikasi manual.
    if(d.nama_klien && (!c.name || c.name === "Perkara Baru")) c.name=d.nama_klien;
    const kd=d.data_klien||{};
    if(kd.alamat && !c.clientAddress) c.clientAddress=kd.alamat;
    if(kd.ktp && !c.clientKtp) c.clientKtp=kd.ktp;
    if(kd.no_hp && !c.clientPhone) c.clientPhone=kd.no_hp;
    if(kd.profesi && !c.clientProfession) c.clientProfession=kd.profesi;
    if(kd.kewarganegaraan && (!c.clientNationality || c.clientNationality === "Warga Negara Indonesia")) c.clientNationality=kd.kewarganegaraan;
    if(kd.tempat_tanggal_lahir && !c.clientBirth) c.clientBirth=kd.tempat_tanggal_lahir;
    if(d.kronologi) c.chronology=d.kronologi;
    if(d.bukti) c.evidence=d.bukti;
    if(d.tujuan) c.goal=d.tujuan;
    c.pdfAnalysisNotes=d.catatan_verifikasi||[];
    c.pdfSourceName=file.name||"Dokumen PDF";
    c.clientDataSource=(d.nama_klien || Object.values(kd).some(Boolean)) ? "PDF perkara/kronologi" : (c.clientDataSource||"");
    save(); renderMiddle(); renderCaseList();
    if(status) status.textContent="✓ PDF berhasil dianalisis. Periksa hasil sebelum menjalankan analisis hukum.";
  }catch(e){ if(status) status.textContent="Gagal menganalisis PDF: "+(e.message||e); }
}
function updateCapStatus(){
  const el = document.getElementById("capStatus");
  if(!el) return;
  el.textContent = getGeminiKey() ? "✅ Gemini AI siap" : "⚠️ Gemini API belum diatur";
}

function saveFirm(){
  try{
    localStorage.setItem(FIRM_KEY, JSON.stringify(firm));
    renderFirmBrand();
    return true;
  }catch(e){
    console.error("Gagal menyimpan identitas/kop surat:", e);
    alert("Kop surat gagal disimpan. Ukuran gambar masih terlalu besar atau penyimpanan browser penuh. Sistem akan mencoba mengecilkan gambar secara otomatis.");
    return false;
  }
}

function compressLetterheadImage(file, maxW=1800, maxH=700, quality=0.88){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error("File gambar tidak dapat dibaca."));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error("Format gambar kop surat tidak dapat dibaca."));
      img.onload = ()=>{
        let w = img.naturalWidth || img.width || 1200;
        let h = img.naturalHeight || img.height || 300;
        const scale = Math.min(1, maxW/w, maxH/h);
        w = Math.max(1, Math.round(w*scale));
        h = Math.max(1, Math.round(h*scale));
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        // JPEG membuat ukuran penyimpanan jauh lebih kecil dan tetap kompatibel dengan DOCX/RTF.
        let data = canvas.toDataURL("image/png");
        resolve(data);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function save(){ localStorage.setItem(LS_KEY, JSON.stringify(state.cases)); }
function activeCase(){ return state.cases.find(c => c.id === state.activeId); }

function newCase(){
  const c = { id: "c" + Date.now(), name: "Perkara Baru", type:"", position:"Penggugat", court:"", location:"", chronology:"", evidence:"", goal:"", clientAddress:"", clientKtp:"", clientPhone:"", clientProfession:"", clientNationality:"Warga Negara Indonesia", clientBirth:"", clientStatus:"Belum ditentukan", clientDataSource:"", pdfSourceName:"", pdfAnalysisNotes:[], analysis:null, suratKuasa:"", suratKuasaKhusus:"", suratKuasaUmum:"", pleidoi:"", suratGugatan:"", somasi:"", jawabanTergugat:"", replik:"", duplikTergugat:"", kesimpulanPerdata:"", eksepsi:"", jawabanTermohon:"", duplikTermohon:"", suratBanding:"", paperSize:"A4", timeline:[], gugatanCheck:null };
  state.cases.unshift(c); state.activeId = c.id; save(); renderAll();
}

function addTimelineEvent(){
  const c = activeCase(); if(!c) return;
  const date = document.getElementById("tlDate").value, label = document.getElementById("tlLabel").value.trim();
  if(!label) return;
  c.timeline = c.timeline || [];
  c.timeline.push({date, label});
  c.timeline.sort((a,b)=> (a.date||"").localeCompare(b.date||""));
  save(); renderMiddle();
}

function removeTimelineEvent(idx){
  const c = activeCase(); if(!c) return;
  c.timeline.splice(idx,1); save(); renderMiddle();
}

function renderTimeline(c){
  const items = (c.timeline||[]).map((t,i)=>`<div class="tl-item"><span class="tl-date">${t.date||"(tanpa tanggal)"}</span>${t.label} <span data-tldel="${i}" style="opacity:.5;cursor:pointer">✕</span></div>`).join("") || `<div class="muted">Belum ada peristiwa.</div>`;

  </div>`;
}

function renderCaseList(){
  const el = document.getElementById("caseList");
  el.innerHTML = state.cases.map(c => `<div class="case-item ${c.id===state.activeId?'active':''}" data-id="${c.id}" style="display:flex;justify-content:space-between;align-items:center">
    <span>${c.name || "(tanpa nama)"}</span><span data-del="${c.id}" style="opacity:.6;padding:0 4px" title="Hapus">✕</span></div>`).join("") || `<div class="muted">Belum ada perkara.</div>`;
  el.querySelectorAll(".case-item span:not([data-del])").forEach(n => n.onclick = () => { state.activeId = n.parentElement.dataset.id; renderAll(); });
  el.querySelectorAll("[data-del]").forEach(n => n.onclick = (e) => { e.stopPropagation(); deleteCase(n.dataset.del); });
}

function deleteCase(id){
  if(!confirm("Hapus perkara ini beserta seluruh datanya?")) return;
  state.cases = state.cases.filter(c=>c.id!==id);
  if(state.activeId===id) state.activeId = state.cases[0]?.id || null;
  save(); renderAll();
}

async function exportBackup(){
  const data = JSON.stringify(state.cases, null, 2);
  const url = URL.createObjectURL(new Blob([data],{type:"application/json;charset=utf-8"}));
  const a = document.createElement("a");
  a.href = url;
  a.download = `legal_ai_backup_${Date.now()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function importBackup(file){
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(!Array.isArray(data)) throw new Error("format tidak valid");
      state.cases = data.concat(state.cases);
      save(); renderAll();
    }catch(e){ alert("Gagal impor: " + e.message); }
  };
  reader.readAsText(file);
}

function documentLooksTruncated(text){
  const s = cleanDocumentText(text).trim();
  if(!s) return false;
  const lines = s.split(/\n+/).map(x=>x.trim()).filter(Boolean);
  const last = lines[lines.length-1] || "";
  // Tanda paling jelas: kalimat terakhir berakhir di tengah kata/frasa.
  if(/\b(ber|dan|atau|dengan|yang|untuk|kepada|atas|dari|dalam|sebagai|apabila|jika|mohon|agar|serta|sehingga|karena|oleh|bahwa|maka|demikian|demi|berdasarkan|terhadap|sesuai)$/i.test(last)) return true;
  if(/\b(Atau apabila Majelis Hakim ber|Atau apabila Majelis Hakim berpendapat|Apabila Majelis Hakim berpendapat)$/i.test(last)) return true;
  // Jangan anggap daftar nomor sebagai selesai jika butir terakhir tidak memiliki isi.
  if(/^\d+[\.)]\s*$/i.test(last)) return true;
  // Potongan yang berakhir dengan tanda koma/titik dua/kurung buka.
  if(/[,:;(\/-]\s*$/.test(last)) return true;
  // Kata penutup yang lazim harus diikuti substansi.
  if(/^(PETITUM|SUBSIDAIR|SUBSIDIAIR|KESIMPULAN)\s*:?\s*$/i.test(last)) return true;
  return false;
}

async function dataUrlToBytes(dataUrl){

}
function getImageMime(dataUrl){
  const m = String(dataUrl||"").match(/^data:image\/([^;,]+)[;,]/i);
  return m ? m[1].toLowerCase() : "";
}
function getDocxImageType(dataUrl){
  const mime = getImageMime(dataUrl);
  if(mime === "jpg" || mime === "jpeg") return "jpg";
  if(mime === "png") return "png";
  if(mime === "gif") return "gif";
  if(mime === "bmp") return "bmp";

}
function imageDims(dataUrl){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.onload = ()=> resolve({w:img.naturalWidth||400, h:img.naturalHeight||100});
    img.onerror = ()=> reject(new Error("Format gambar kop surat tidak dapat dibaca."));

}
async function prepareLetterheadImage(dataUrl){
  // Selalu ubah ke PNG. Ini menghindari masalah kompatibilitas ImageRun
  // dengan JPEG/format lain pada beberapa versi Microsoft Word.
  const img = await new Promise((resolve,reject)=>{
    const el = new Image();
    el.onload = ()=>resolve(el);
    el.onerror = ()=>reject(new Error("Kop surat tidak dapat diproses."));
    el.src = dataUrl;
  });
  let w = img.naturalWidth || img.width || 1600;
  let h = img.naturalHeight || img.height || 500;

  // Batasi ukuran gambar agar DOCX tidak terlalu berat, tetapi tetap
  // mempertahankan rasio asli kop surat.
  const scale = Math.min(1, 1800 / w, 900 / h);
  w = Math.max(1, Math.round(w * scale));
  h = Math.max(1, Math.round(h * scale));

  const canvas = document.createElement("canvas");
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext("2d");
  if(!ctx) throw new Error("Browser tidak mendukung pemrosesan gambar kop surat.");
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0,0,w,h);
  ctx.drawImage(img,0,0,w,h);

  return {data:canvas.toDataURL("image/png"), type:"png"};
}

function xmlEscape(s){
  return String(s ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&apos;");
}

function utf8Bytes(s){

function crc32(bytes){
  let table = crc32._table;
  if(!table){
    table = new Uint32Array(256);
    for(let n=0;n<256;n++){
      let c=n;
      for(let k=0;k<8;k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      table[n]=c>>>0;
    }
    crc32._table=table;
  }
  let c=0xFFFFFFFF;
  for(let i=0;i<bytes.length;i++) c = table[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

}

  const total=arrays.reduce((n,a)=>n+a.length,0);
  const out=new Uint8Array(total);
  let p=0;
  for(const a of arrays){ out.set(a,p); p+=a.length; }
  return out;
}

// ZIP "store" (tanpa kompresi). Word menerima ZIP jenis ini dan tidak
// membutuhkan JSZip/pustaka eksternal.
function makeZip(entries){
  const localParts=[], centralParts=[];
  let offset=0;

  const now=new Date();
  const dosTime=((now.getHours()<<11)|(now.getMinutes()<<5)|Math.floor(now.getSeconds()/2))&0xFFFF;
  const dosDate=(((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate())&0xFFFF;

  for(const entry of entries){
    const name=utf8Bytes(entry.name);
    const data=entry.data instanceof Uint8Array ? entry.data : utf8Bytes(entry.data);
    const crc=crc32(data);

    const local=concatBytes(
      u32(0x04034b50), u16(20), u16(0x0800), u16(0),
      u16(dosTime), u16(dosDate), u32(crc), u32(data.length), u32(data.length),
      u16(name.length), u16(0), name, data
    );
    localParts.push(local);

    const central=concatBytes(
      u32(0x02014b50), u16(20), u16(20), u16(0x0800), u16(0),
      u16(dosTime), u16(dosDate), u32(crc), u32(data.length), u32(data.length),
      u16(name.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(offset),
      name
    );
    centralParts.push(central);
    offset += local.length;
  }

  const centralOffset=offset;
  const central=concatBytes(...centralParts);
  const local=concatBytes(...localParts);
  const end=concatBytes(
    u32(0x06054b50), u16(0), u16(0), u16(entries.length), u16(entries.length),
    u32(central.length), u32(centralOffset), u16(0)
  );
  return new Blob([local,central,end], {
    type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"
  });
}

function base64ToBytes(dataUrl){
  const m=String(dataUrl||"").match(/^data:[^;,]+;base64,(.*)$/s);
  if(!m) throw new Error("Data gambar kop surat tidak valid.");
  const bin=atob(m[1]);
  const out=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
  return out;
}

function makeDocxTextParagraph(line, isHeading, upper, compact=false){
  const clean=cleanDocumentText(line).trim();
  if(!clean){
    return `<w:p><w:pPr><w:jc w:val="both"/><w:spacing w:before="0" w:after="0" w:line="${compact?240:360}" w:lineRule="auto"/></w:pPr><w:r><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman"/><w:sz w:val="24"/></w:rPr><w:t xml:space="preserve"></w:t></w:r></w:p>`;
  }
  const bold=(isHeading||upper) ? "<w:b/>" : "";
  const labelLine=/^(Nama|Alamat|No\. KTP|No\. HP|Profesi|Kewarganegaraan|Tempat\s*\/\s*Tanggal Lahir|Nomor|Perihal|Tempat|Pekerjaan)\s*:/i.test(clean);
  const firstIndent=(isHeading||upper||labelLine) ? "" : (compact ? '<w:ind w:firstLine="0"/>' : '<w:ind w:firstLine="720"/>');
  const align=/^(Hal|Perihal|Nomor)\s*:/i.test(clean) ? '<w:jc w:val="left"/>' : '<w:jc w:val="both"/>';
  const sz=24;
  const singleLine = compact || labelLine || /^(?:["“]|Pasal\s+)/i.test(clean);
  const lineSpace=singleLine ? 240 : 360;
  const after=0;
  return `<w:p><w:pPr>${align}${firstIndent}<w:spacing w:before="${isHeading?120:0}" w:after="${after}" w:line="${lineSpace}" w:lineRule="auto"/></w:pPr><w:r><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman"/><w:sz w:val="${sz}"/>${bold}</w:rPr><w:t xml:space="preserve">${xmlEscape(clean)}</w:t></w:r></w:p>`;
}

async function buildDocxBlob(c, key){
  const text=cleanDocumentText(c[key] || "");
  const compact = key === "suratKuasaKhusus" || key === "suratKuasaUmum";
  const selectedLetterhead=getSelectedLetterhead(c,key);
  const entries=[];
  let body="";

  if(selectedLetterhead?.image){
    const prepared=await prepareLetterheadImage(selectedLetterhead.image);
    const dims=await imageDims(prepared.data);

    // 6.5 inch wide maximum inside a normal Word page.
    const maxW=6248400; // 6.5 * 914400 EMU
    const maxH=1800000; // prevents an unusually tall image
    const ratio=dims.h/dims.w;
    let cx=Math.min(maxW, Math.round(dims.w*914400/96));
    let cy=Math.round(cx*ratio);
    if(cy>maxH){
      cy=maxH;
      cx=Math.round(cy/ratio);
    }

    const imageBytes=base64ToBytes(prepared.data);
    body += makeDocxImageXml("rId1",cx,cy);
    entries.push({name:"word/media/kop-surat.png",data:imageBytes});
  }else if(firm.name || firm.logo){
    // Fallback jika belum ada kop tersimpan.
    if(firm.logo){
      try{
        const preparedLogo=await prepareLetterheadImage(firm.logo);
        const dims=await imageDims(preparedLogo.data);
        const maxW=1200000;
        let cx=Math.min(maxW,Math.round(dims.w*914400/96));
        let cy=Math.round(cx*dims.h/dims.w);
        body += makeDocxImageXml("rId1",cx,cy);
        entries.push({name:"word/media/logo.png",data:base64ToBytes(preparedLogo.data)});
      }catch(e){}
    }
    if(firm.name){
      body += `<w:p><w:pPr><w:jc w:val="center"/><w:spacing w:after="40"/></w:pPr><w:r><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman"/><w:b/><w:sz w:val="28"/></w:rPr><w:t>${xmlEscape(cleanDocumentText(firm.name))}</w:t></w:r></w:p>`;
    }
    const addrLine=[firm.address,firm.contact].filter(Boolean).map(cleanDocumentText).join(" | ");
    if(addrLine) body += `<w:p><w:pPr><w:jc w:val="center"/><w:spacing w:after="80"/></w:pPr><w:r><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman"/><w:sz w:val="20"/></w:rPr><w:t>${xmlEscape(addrLine)}</w:t></w:r></w:p>`;
    body += `<w:p><w:pPr><w:jc w:val="center"/><w:spacing w:after="180"/></w:pPr><w:r><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman"/><w:sz w:val="18"/></w:rPr><w:t>${"_".repeat(85)}</w:t></w:r></w:p>`;
  }

  const lines=text.split("\n");
  for(const line0 of lines){
    const clean=cleanDocumentText(line0).trim();
    const upper=clean===clean.toUpperCase() && /[A-ZÀ-Ú]/.test(clean);
    const isHeading=/^(I{1,3}|IV|V|VI|VII|VIII|IX|X)\.|^(PERIHAL|HAL|PETITUM|POSITA|DASAR HUKUM|IDENTITAS|FAKTA HUKUM|SURAT KUASA|SURAT SOMASI|SURAT GUGATAN|JAWABAN|REPLIK|DUPLIK|EKSEPSI|KESIMPULAN|BANDING|PLEIDOI|PEMBELAAN)/i.test(clean);
    body += makeDocxTextParagraph(line0,isHeading,upper,compact);
  }

  const rels=selectedLetterhead?.image || firm.logo
    ? `<Relationship xmlns="http://schemas.openxmlformats.org/package/2006/relationships" Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/${selectedLetterhead?.image ? "kop-surat.png" : "logo.png"}"/>`
    : "";

  // Page setup: A4 (default) atau F4 21x33 cm. Margin kiri 4 cm, atas 3 cm, bawah 3 cm, kanan 3 cm.
  const isF4 = c.paperSize === "F4";
  const pageW = isF4 ? 11907 : 11907;
  const pageH = isF4 ? 18709 : 16840;
  const marginLeft = 2268;  // 4 cm
  const marginTop = 1701;   // 3 cm
  const marginRight = 1701; // 3 cm
  const marginBottom = 1701;// 3 cm
  const documentXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture">
<w:body>${body}
<w:sectPr><w:pgSz w:w="${pageW}" w:h="${pageH}"/><w:pgMar w:top="${marginTop}" w:right="${marginRight}" w:bottom="${marginBottom}" w:left="${marginLeft}" w:header="720" w:footer="720" w:gutter="0"/></w:sectPr>
</w:body></w:document>`;

  const stylesXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
<w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman"/><w:sz w:val="24"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:jc w:val="both"/><w:spacing w:after="0" w:line="360" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults>
<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style>
</w:styles>`;

  const contentTypes=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
${(selectedLetterhead?.image || firm.logo) ? '<Default Extension="png" ContentType="image/png"/>' : ''}
<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>
</Types>`;

  const packageRels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rIdOfficeDocument" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`;

  const docRels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${rels}</Relationships>`;

  entries.unshift(
    {name:"[Content_Types].xml",data:utf8Bytes(contentTypes)},
    {name:"_rels/.rels",data:utf8Bytes(packageRels)},
    {name:"word/document.xml",data:utf8Bytes(documentXml)},
    {name:"word/styles.xml",data:utf8Bytes(stylesXml)},
    {name:"word/_rels/document.xml.rels",data:utf8Bytes(docRels)}
  );

  return makeZip(entries);
}
function rtfEscape(s){
  return String(s||"").replace(/\\/g,"\\\\").replace(/{/g,"\\{").replace(/}/g,"\\}").replace(/\t/g,"\\tab ");
}

async function buildRtf(c,key){
  const text = cleanDocumentText(c[key] || "");
  const lines = text.split("\n");
  const parts = [
    "{\\rtf1\\ansi\\deff0",
    "{\\fonttbl{\\f0 Times New Roman;}}",
    `\\paperw${c.paperSize === "F4" ? 11907 : 11907}\\paperh${c.paperSize === "F4" ? 18709 : 16840}\\margl2268\\margr1701\\margt1701\\margb1701`,
    "\\f0\\fs24\\sl360\\slmult1"
  ];
  const selectedLetterhead = getSelectedLetterhead(c,key);

  // RTF juga mencoba menyisipkan kop gambar agar fallback tetap membawa kop terpilih.
  if(selectedLetterhead?.image){
    try{
      const match = selectedLetterhead.image.match(/^data:image\/(png|jpeg|jpg);base64,(.+)$/i);
      if(match){
        const bytes = Uint8Array.from(atob(match[2]), ch => ch.charCodeAt(0));
        let hex = "";
        for(let i=0;i<bytes.length;i++) hex += bytes[i].toString(16).padStart(2,"0");
        const dims = await imageDims(selectedLetterhead.image);
        const pxToTwips = v => Math.max(100, Math.round(v * 1440 / 96));
        const blip = match[1].toLowerCase()==="png" ? "\\pngblip" : "\\jpegblip";
        parts.push(`{${blip}\\picw${dims.w}\\pich${dims.h}\\picwgoal${pxToTwips(dims.w)}\\pichgoal${pxToTwips(dims.h)}\n${hex}}\\par`);
      } else {
        parts.push("\\qc\\b " + rtfEscape(selectedLetterhead.name || "Kop Surat") + "\\b0\\par");
      }
    }catch(e){
      parts.push("\\qc\\b " + rtfEscape(selectedLetterhead.name || "Kop Surat") + "\\b0\\par");
    }
  } else if(firm.name || firm.address || firm.contact){
    if(firm.name){ parts.push("\\qc\\b "+rtfEscape(cleanDocumentText(firm.name))+"\\b0\\par"); }
    if(firm.address || firm.contact){ parts.push("\\qc "+rtfEscape([firm.address,firm.contact].filter(Boolean).map(cleanDocumentText).join(" | "))+"\\par"); }
    parts.push("\\qc "+"_".repeat(80)+"\\par\\ql");
  }

  for(const line0 of lines){
    const line = cleanDocumentText(line0).trim();
    if(!line){ parts.push("\\par"); continue; }
    const upper = line === line.toUpperCase() && /[A-ZÀ-Ú]/.test(line);
    const isHeading = /^(I{1,3}|IV|V|VI|VII|VIII|IX|X)\\.|^(PERIHAL|HAL|PETITUM|POSITA|DASAR HUKUM|IDENTITAS|FAKTA HUKUM|SURAT KUASA|SURAT SOMASI|SURAT GUGATAN)/i.test(line);
    parts.push((isHeading||upper?"\\b ":"\\fi720 ")+rtfEscape(line)+(isHeading||upper?"\\b0":"")+"\\par");
  }
  parts.push("}");
  return parts.join("\n");
}
async function downloadDoc(key){
  const c = activeCase();
  if(!c || !c[key]) return;
  const status = document.getElementById("dlStatus-" + key);
  if(status) status.textContent = "Menyiapkan…";
  try{
    const blob = await buildDocxBlob(c, key);
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    const docNames = {suratKuasaKhusus:"Surat_Kuasa_Khusus",suratKuasaUmum:"Surat_Kuasa_Umum",pleidoi:"Pleidoi_Pembelaan",somasi:"Surat_Somasi",suratGugatan:"Surat_Gugatan",jawabanTergugat:"Jawaban_Tergugat",replik:"Replik",duplikTergugat:"Duplik_Tergugat",kesimpulanPerdata:"Surat_Kesimpulan",eksepsi:"Eksepsi",jawabanTermohon:"Jawaban_Termohon",duplikTermohon:"Duplik_Termohon",suratBanding:"Surat_Banding"};
    a.download = `${docNames[key] || key}_${(c.name || "perkara").replace(/[^a-z0-9_-]+/gi,"_")}.docx`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    if(status) status.textContent = "✓ Berhasil diunduh";
  }catch(e){
    console.error("Gagal membuat DOCX dengan kop surat:", e);
    if(status) status.textContent = "❌ Gagal membuat Word: " + (e.message || e);
    alert("Dokumen Word gagal dibuat. Detail: " + (e.message || e));
  }
}

async function downloadRtf(key){
  const c = activeCase();
  if(!c || !c[key]) return;

    a.download = `${docNames[key] || key}_${(c.name || "perkara").replace(/[^a-z0-9_-]+/gi,"_")}.rtf`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    if(status) status.textContent = "✓ Berhasil diunduh";
  }catch(e){
    if(status) status.textContent = "Gagal: " + (e.message || e);

}
